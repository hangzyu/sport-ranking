<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#245bff">
  <title>登录 · Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="src/install.css">
  <link rel="stylesheet" href="src/theme.css?v=27">
  <link rel="stylesheet" href="src/login-page.css?v=7">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
</head>
<body>
  <div class="stadium" aria-hidden="true"><div class="pitch"></div></div>
  <div class="login-page login-overlay" id="loginPageRoot">
    <div class="login-page-shell">
      <div class="login-page-brand">
        <img src="assets/ranking-logo-v1.png" alt="">
        <h1>Ranking</h1>
      </div>
      <section class="login-page-card">
        <div id="loginContent"></div>
      </section>
      <a class="login-page-back" href="index.html">← 返回赛事首页</a>
    </div>
  </div>
  <script src="src/billing.js"></script>
  <script src="src/phone-login.js?v=6"></script>
  <script>
    function currentUser(){
      try{
        const user=JSON.parse(localStorage.getItem('ranking-user')||'null');
        return user&&user.phone&&user.verified?user:null;
      }catch{return null}
    }
    function planLabel(){
      try{
        if(window.RankingBilling?.monthlyActive?.()) return '个人包月会员';
        const user=currentUser();
        if(user?.plan==='event') return '赛事会员';
        if(user?.plan==='monthly') return '个人包月会员';
        return '基础服务';
      }catch{return '基础服务'}
    }
    function eventLabel(){
      try{
        const active=localStorage.getItem('ranking-active-event')||'';
        const index=JSON.parse(localStorage.getItem('ranking-events-index')||'[]');
        const item=Array.isArray(index)?index.find(event=>event.id===active)||index[0]:null;
        if(!item) return '暂无赛事';
        let groups=1;
        try{
          const saved=JSON.parse(localStorage.getItem('ranking-event:'+item.id)||'{}');
          groups=Array.isArray(saved.groups)&&saved.groups.length?saved.groups.length:1;
        }catch{}
        return item.name+' · '+groups+' 个小组';
      }catch{return '本机赛事'}
    }
    PhoneLogin.mount({
      page:true,
      planLabel,
      eventLabel,
      plan(){
        try{return currentUser()?.plan||'trial'}catch{return 'trial'}
      }
    });
  </script>
</body>
</html>
