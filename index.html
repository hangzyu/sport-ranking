function validEventBackup(event){

  const groups=Array.isArray(event.groups)&&event.groups.length?event.groups:[event];
  return groups.every(group=>Array.isArray(group.teams)&&group.teams.length>=2&&Array.isArray(group.matches||[])&&(group.matches||[]).every(match=>Array.isArray(match)&&group.teams.includes(match[0])&&group.teams.includes(match[1])&&match[0]!==match[1]));
}
function initEventBackup(){
  const actions=document.querySelector('.header-actions');
  if(!actions||$('exportEvent'))return;
  actions.insertAdjacentHTML('beforeend','<button class="secondary" id="exportEvent" type="button">导出备份</button><button class="secondary" id="importEvent" type="button">导入备份</button><input id="importEventFile" type="file" accept="application/json,.json" hidden>');
  $('exportEvent').onclick=()=>{
    saveCurrentGroup();
    const event=JSON.parse(JSON.stringify({...state,simulation:{},manualDrafts:{}}));
    const blob=new Blob([JSON.stringify({format:'ranking-event',version:1,exportedAt:new Date().toISOString(),event},null,2)],{type:'application/json'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download=`${(state.name||'ranking-event').replace(/[\\/:*?"<>|]/g,'_')}-backup.json`;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),0);
  };
  $('importEvent').onclick=()=>$('importEventFile').click();
  $('importEventFile').onchange=async()=>{
    const file=$('importEventFile').files?.[0];
    if(!file)return;
    try{
      const data=JSON.parse(await file.text()),event=data?.event||data;
      if(!validEventBackup(event))throw new Error('备份文件缺少有效的小组、球队或赛程数据');
      if(!confirm('导入将替换当前浏览器中的赛事数据。是否继续？'))return;
      saveImportedActiveEvent(event);
      location.reload();
    }catch(error){
      alert(`无法导入备份：${error.message||'文件格式不正确'}`);
    }finally{$('importEventFile').value=''};
  };
}

    document.querySelectorAll('[data-cancel-rename]').forEach(button=>button.onclick=()=>{editingEventId='';renderEventManager()});
    document.querySelectorAll('[data-confirm-rename]').forEach(button=>button.onclick=()=>{const id=button.dataset.confirmRename,event=eventIndex.find(item=>item.id===id),name=$('renameEventName')?.value.trim();if(!name){$('renameEventName')?.focus();return}event.name=name;event.updatedAt=new Date().toISOString();if(id===activeEventId){state.name=name;$('name').value=name;persistActiveEvent();render()}else{try{const saved=JSON.parse(localStorage.getItem(`ranking-event:${id}`)||'{}');saved.name=name;localStorage.setItem(`ranking-event:${id}`,JSON.stringify(saved))}catch{}}localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));editingEventId='';renderEventManager()});
    document.querySelectorAll('[data-delete-event]').forEach(button=>button.onclick=()=>{const id=button.dataset.deleteEvent,event=eventIndex.find(item=>item.id===id);if(eventIndex.length===1){alert('请先新建另一项赛事，再删除当前赛事。');return}if(!confirm(`将永久删除“${event?.name||'该赛事'}”及其全部数据。是否继续？`))return;eventIndex=eventIndex.filter(item=>item.id!==id);localStorage.removeItem(`ranking-event:${id}`);if(activeEventId===id)activeEventId=eventIndex[0].id;localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()});
    $('createEvent').onclick=()=>{const name=$('newEventName').value.trim();if(!name){$('newEventName').focus();return}const id=`event-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,event=JSON.parse(JSON.stringify(defaultState));event.name=name;eventIndex.unshift({id,name,updatedAt:new Date().toISOString()});localStorage.setItem(`ranking-event:${id}`,JSON.stringify(event));localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));activeEventId=id;localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()};
  };
  $('eventManager').onclick=()=>{renderEventManager();$('eventManagerDialog').showModal()};
  $('closeEventManager').onclick=()=>$('eventManagerDialog').close();
}
initEventManager();
</script></body></html>
