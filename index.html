<body><main class="app"><header><div><div class="eyebrow">FOOTBALL GROUP STANDINGS</div><h1>Ranking</h1><p>足球小组赛积分排名与解释系统</p></div><div class="header-actions"><span class="status" id="statusBadge">草稿</span><button class="secondary" id="publish">发布赛事</button><button id="save">保存赛事</button></div></header><div class="grid"><aside class="card"><h2>赛事设置</h2><label class="label">赛事名称</label><input class="field" id="name" value="示例足球小组赛"><div class="label label-line">积分排名方法 <button class="info" id="methodInfo" type="button" aria-label="查看积分排名方法说明">i</button></div><select class="field" id="method"><option value="I">类型 I：先相互比较；再全组比较</option><option value="II" selected>类型 II：先相互比较；支持二次相互比较；最后全组比较</option><option value="III">类型 III：先全组比较；再相互比较</option></select><div class="notice" id="methodHelp"></div><label class="label">球队</label><div class="teams" id="teams"></div><button class="secondary" id="updateTeams" style="margin-top:10px">更新球队名称</button></aside><section class="card"><div class="tabs"><button class="tab active" data-view="schedule">赛程与赛果</button><button class="tab" data-view="standing">积分榜</button><button class="tab" data-view="trace">排名说明</button><button class="tab" data-view="simulation">情景推演</button><button class="tab" data-view="members">成员授权</button></div><div id="schedule"></div><div id="standing" class="hidden"></div><div id="trace" class="hidden"></div><div id="simulation" class="hidden"></div><div id="members" class="hidden"></div></section></div></main><dialog class="method-dialog" id="methodDialog"><div class="dialog-content"><button class="dialog-close" id="closeDialog" type="button" aria-label="关闭">×</button><h2 id="dialogTitle"></h2><p id="dialogLead"></p><ol class="method-list" id="dialogRules"></ol></div></dialog><script>function compute(matches=state.matches){
  const actual=matches.filter(m=>m[5]).map(m=>m.slice(0,4));
  let ranking;
  try{ranking=RankingCore.rank(state.teams,actual,state.method||$('method').value)}
  catch(error){return{s:{},order:[],trace:[`无法生成排名：${error.message}`],unresolved:[]}}

function positionSidebarToggle(){const grid=document.querySelector('.grid'),main=grid?.querySelector(':scope > section'),button=$('sidebarCollapse');if(!grid||!main||!button)return;button.style.left=`${Math.max(16,main.getBoundingClientRect().left)}px`}positionSidebarToggle();window.addEventListener('resize',positionSidebarToggle);$('sidebarCollapse')?.addEventListener('click',()=>requestAnimationFrame(positionSidebarToggle));

function validEventBackup(event){
  if(!event||typeof event!=='object')return false;
  const groups=Array.isArray(event.groups)&&event.groups.length?event.groups:[event];
  return groups.every(group=>Array.isArray(group.teams)&&group.teams.length>=2&&Array.isArray(group.matches||[])&&(group.matches||[]).every(match=>Array.isArray(match)&&group.teams.includes(match[0])&&group.teams.includes(match[1])&&match[0]!==match[1]));
}
function initEventBackup(){
  const actions=document.querySelector('.header-actions');
  if(!actions||$('exportEvent'))return;
  actions.insertAdjacentHTML('beforeend','<button class="secondary" id="exportEvent" type="button">导出备份</button><button class="secondary" id="importEvent" type="button">导入备份</button><input id="importEventFile" type="file" accept="application/json,.json" hidden>');
  $('exportEvent').onclick=()=>{
    saveCurrentGroup();
    const event=JSON.parse(JSON.stringify({...state,simulation:{},manualDrafts:{}}));
    const blob=new Blob([JSON.stringify({format:'ranking-event',version:1,exportedAt:new Date().toISOString(),event},null,2)],{type:'application/json'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download=`${(state.name||'ranking-event').replace(/[\\/:*?"<>|]/g,'_')}-backup.json`;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),0);
  };
  $('importEvent').onclick=()=>$('importEventFile').click();
  $('importEventFile').onchange=async()=>{
    const file=$('importEventFile').files?.[0];
    if(!file)return;
    try{
      const data=JSON.parse(await file.text()),event=data?.event||data;
      if(!validEventBackup(event))throw new Error('备份文件缺少有效的小组、球队或赛程数据');
      if(!confirm('导入将替换当前浏览器中的赛事数据。是否继续？'))return;
      saveImportedActiveEvent(event);
      location.reload();
    }catch(error){
      alert(`无法导入备份：${error.message||'文件格式不正确'}`);
    }finally{$('importEventFile').value=''};
  };
}
initEventBackup();
if(('serviceWorker' in navigator)&&(location.protocol==='http:'||location.protocol==='https:')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));

function normalizePhone(value){return String(value||'').replace(/\s/g,'')}
function syncPublicationAccess(){
  const published=state.status!=='草稿';
  document.querySelectorAll('[data-view="standing"],[data-view="trace"],[data-view="simulation"]').forEach(tab=>{
    tab.disabled=!published;
    tab.title=published?'':'请先发布赛事后使用';
  });
  if(!published&&document.querySelector('.tab.active')?.dataset.view!=='schedule'){
    document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view==='schedule'));
    ['schedule','standing','trace','simulation','members','membership'].forEach(view=>$(view)?.classList.toggle('hidden',view!=='schedule'));
  }
}
function saveAccountPlan(plan){try{const user=JSON.parse(localStorage.getItem('ranking-user')||'null');if(!user)return;user.plan=plan;user.updatedAt=new Date().toISOString();localStorage.setItem('ranking-user',JSON.stringify(user))}catch{}}
function initPhoneLogin(){
  const actions=document.querySelector('.header-actions');
  if(!actions||$('accountEntry'))return;
  actions.insertAdjacentHTML('afterbegin','<button class="secondary account-entry" id="accountEntry" type="button">登录</button>');
  document.body.insertAdjacentHTML('beforeend','<dialog class="method-dialog login-dialog" id="loginDialog"><div class="dialog-content"><button class="dialog-close" id="closeLoginDialog" type="button" aria-label="关闭">×</button><div id="loginContent"></div></div></dialog>');
  const renderLogin=()=>{
    const user=JSON.parse(localStorage.getItem('ranking-user')||'null');
    $('accountEntry').textContent=user?`账户 · ${user.phone}`:'登录';
    const planLabel={trial:'7 天体验',normal:'普通会员',premium:'高级会员'}[user?.plan||state.plan||'trial'];
    $('loginContent').innerHTML=user?`<h2>账户中心</h2><div class="account-panel"><strong>${user.phone}</strong><p>已通过手机号验证码登录</p><p>当前权益：${planLabel}</p><p>本机赛事：${state.name} · ${state.groups?.length||1} 个小组</p><p>当前为本机演示账户；接入服务后可同步赛事、权益与多设备数据。</p></div><div class="account-actions"><button class="secondary" id="logoutAccount" type="button">退出登录</button></div>`:`<h2>手机号验证码登录</h2><p class="login-intro">首次验证手机号后将自动创建账户。</p><form class="login-form" id="loginForm"><input class="field" id="loginPhone" inputmode="tel" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号"><div class="login-code-row"><input class="field" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="输入验证码"><button class="secondary" id="sendLoginCode" type="button">获取验证码</button></div><p class="login-hint" id="loginHint"></p><button class="login-submit" type="submit">登录 / 注册</button></form><div class="login-demo">演示环境：当前不发送真实短信。完成后会接入短信服务、验证码校验与安全限流。</div>`;
    const logout=$('logoutAccount');
    if(logout)logout.onclick=()=>{localStorage.removeItem('ranking-user');renderLogin();$('loginDialog').close()};
    const send=$('sendLoginCode');
    if(send)send.onclick=()=>{const phone=normalizePhone($('loginPhone').value);$('loginHint').textContent=/^1\d{10}$/.test(phone)?'验证码已发送（演示环境不发送真实短信）。':'请输入有效的 11 位手机号。'};
    const form=$('loginForm');
    if(form)form.onsubmit=event=>{event.preventDefault();const phone=normalizePhone($('loginPhone').value),code=normalizePhone($('loginCode').value);if(!/^1\d{10}$/.test(phone)){ $('loginHint').textContent='请输入有效的 11 位手机号。';return }if(!/^\d{6}$/.test(code)){ $('loginHint').textContent='请输入 6 位验证码。';return }localStorage.setItem('ranking-user',JSON.stringify({phone,plan:state.plan||'trial',loggedInAt:new Date().toISOString()}));renderLogin();$('loginDialog').close()};
  };
  $('accountEntry').onclick=()=>{renderLogin();$('loginDialog').showModal()};
  $('closeLoginDialog').onclick=()=>$('loginDialog').close();
  renderLogin();
}
initPhoneLogin();
function updateEventIndex(name){
  const index=eventIndex.findIndex(event=>event.id===activeEventId);
  const record={id:activeEventId,name:(name||defaultState.name).trim()||defaultState.name,updatedAt:new Date().toISOString()};
  if(index<0)eventIndex.unshift(record);else eventIndex[index]=record;
  localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));
  localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);
}
function persistActiveEvent(){
  saveCurrentGroup();
  localStorage.setItem(`ranking-event:${activeEventId}`,JSON.stringify({...state,simulation:{},manualDrafts:{}}));
  updateEventIndex(state.name);
}
function saveImportedActiveEvent(event){
  localStorage.setItem(`ranking-event:${activeEventId}`,JSON.stringify({...event,simulation:{},manualDrafts:{}}));
  updateEventIndex(event.name);
}
function initEventManager(){
  const actions=document.querySelector('.header-actions');
  if(!actions||$('eventManager'))return;
  let editingEventId='';
  actions.insertAdjacentHTML('afterbegin','<button class="secondary" id="eventManager" type="button">赛事管理</button>');
  document.body.insertAdjacentHTML('beforeend','<dialog class="method-dialog" id="eventManagerDialog"><div class="dialog-content"><button class="dialog-close" id="closeEventManager" type="button" aria-label="关闭">×</button><div id="eventManagerContent"></div></div></dialog>');
  const renderEventManager=()=>{
    const rows=eventIndex.map(event=>`<div class="member-row"><div>${editingEventId===event.id?`<input class="field" id="renameEventName" maxlength="40" value="${event.name}" aria-label="赛事新名称">`:`<div class="member-name">${event.name}</div>`}<div class="member-role">${event.id===activeEventId?'当前赛事':'上次保存：'+new Date(event.updatedAt).toLocaleString('zh-CN',{hour12:false})}</div></div><div class="account-actions" style="margin-top:0">${editingEventId===event.id?`<button data-confirm-rename="${event.id}" type="button">保存</button><button class="secondary" data-cancel-rename type="button">取消</button>`:`<button class="secondary" data-switch-event="${event.id}" type="button" ${event.id===activeEventId?'disabled':''}>切换</button><button class="secondary" data-rename-event="${event.id}" type="button">重命名</button><button class="member-remove" data-delete-event="${event.id}" type="button">删除</button>`}</div></div>`).join('');
    $('eventManagerContent').innerHTML=`<h2>赛事管理</h2><p>各赛事独立保存小组、赛程、赛果、成员与设置。</p><div class="member-list">${rows}</div><div class="member-add"><input class="field" id="newEventName" maxlength="40" placeholder="输入新赛事名称"><button id="createEvent" type="button">新建赛事</button></div>`;
    document.querySelectorAll('[data-switch-event]').forEach(button=>button.onclick=()=>{persistActiveEvent();activeEventId=button.dataset.switchEvent;localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()});
    document.querySelectorAll('[data-rename-event]').forEach(button=>button.onclick=()=>{editingEventId=button.dataset.renameEvent;renderEventManager();$('renameEventName')?.focus()});
    document.querySelectorAll('[data-cancel-rename]').forEach(button=>button.onclick=()=>{editingEventId='';renderEventManager()});
    document.querySelectorAll('[data-confirm-rename]').forEach(button=>button.onclick=()=>{const id=button.dataset.confirmRename,event=eventIndex.find(item=>item.id===id),name=$('renameEventName')?.value.trim();if(!name){$('renameEventName')?.focus();return}event.name=name;event.updatedAt=new Date().toISOString();if(id===activeEventId){state.name=name;$('name').value=name;persistActiveEvent();render()}else{try{const saved=JSON.parse(localStorage.getItem(`ranking-event:${id}`)||'{}');saved.name=name;localStorage.setItem(`ranking-event:${id}`,JSON.stringify(saved))}catch{}}localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));editingEventId='';renderEventManager()});
    document.querySelectorAll('[data-delete-event]').forEach(button=>button.onclick=()=>{const id=button.dataset.deleteEvent,event=eventIndex.find(item=>item.id===id);if(eventIndex.length===1){alert('请先新建另一项赛事，再删除当前赛事。');return}if(!confirm(`将永久删除“${event?.name||'该赛事'}”及其全部数据。是否继续？`))return;eventIndex=eventIndex.filter(item=>item.id!==id);localStorage.removeItem(`ranking-event:${id}`);if(activeEventId===id)activeEventId=eventIndex[0].id;localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()});
    $('createEvent').onclick=()=>{const name=$('newEventName').value.trim();if(!name){$('newEventName').focus();return}const id=`event-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,event=JSON.parse(JSON.stringify(defaultState));event.name=name;eventIndex.unshift({id,name,updatedAt:new Date().toISOString()});localStorage.setItem(`ranking-event:${id}`,JSON.stringify(event));localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));activeEventId=id;localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()};
  };
  $('eventManager').onclick=()=>{renderEventManager();$('eventManagerDialog').showModal()};
  $('closeEventManager').onclick=()=>$('eventManagerDialog').close();
}
initEventManager();
