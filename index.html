  };

  const tournament=result.tournament;
  const owner=user.id||user.phone;
  const storedOwner=localStorage.getItem('ranking-cloud-owner')||'';
  if(!tournament){
    cloudPhase='ready';
    if(storedOwner&&storedOwner!==owner){window.RankingInstall?.saved(true);return}
    await pushTournament();
    return;
  }
  const revision=owner+':'+(tournament.updatedAt||'');
  if(localStorage.getItem('ranking-cloud-revision')!==revision&&applyTournamentData(tournament.data)){
    rememberCloud(user,tournament.updatedAt);
    location.reload();
    return;
  }
  rememberCloud(user,tournament.updatedAt);
  cloudPhase='ready';
  window.RankingInstall?.cloudStatus?.('已同步到云端');
  if(cloudDirty){cloudDirty=false;scheduleCloudSync()}
}
function persistActiveEvent(){
  try{
    saveCurrentGroup();
    localStorage.setItem(`ranking-event:${activeEventId}`,JSON.stringify({...state,simulation:{},manualDrafts:{}}));
    updateEventIndex(state.name);scheduleCloudSync();return true;
  }catch(error){window.RankingInstall?.saved(false);return false;}
}
function saveImportedActiveEvent(event){
  localStorage.setItem(`ranking-event:${activeEventId}`,JSON.stringify({...event,simulation:{},manualDrafts:{}}));
  updateEventIndex(event.name);
}
function initEventManager(){
  const actions=document.querySelector('.header-actions');
  if(!actions||$('eventManager'))return;
  let editingEventId='';
  actions.insertAdjacentHTML('afterbegin','<button class="secondary" id="eventManager" type="button">赛事管理</button>');
  document.body.insertAdjacentHTML('beforeend','<dialog class="method-dialog" id="eventManagerDialog"><div class="dialog-content"><button class="dialog-close" id="closeEventManager" type="button" aria-label="关闭">×</button><div id="eventManagerContent"></div></div></dialog>');
  const renderEventManager=()=>{
    const rows=eventIndex.map(event=>`<div class="member-row"><div>${editingEventId===event.id?`<input class="field" id="renameEventName" maxlength="40" value="${event.name}" aria-label="赛事新名称">`:`<div class="member-name">${event.name}</div>`}<div class="member-role">${event.id===activeEventId?'当前赛事':'上次保存：'+new Date(event.updatedAt).toLocaleString('zh-CN',{hour12:false})}</div></div><div class="account-actions" style="margin-top:0">${editingEventId===event.id?`<button data-confirm-rename="${event.id}" type="button">保存</button><button class="secondary" data-cancel-rename type="button">取消</button>`:`<button class="secondary" data-switch-event="${event.id}" type="button" ${event.id===activeEventId?'disabled':''}>切换</button><button class="secondary" data-rename-event="${event.id}" type="button">重命名</button><button class="member-remove" data-delete-event="${event.id}" type="button">删除</button>`}</div></div>`).join('');
    $('eventManagerContent').innerHTML=`<h2>赛事管理</h2><p>各赛事独立保存小组、赛程、赛果、成员与设置。</p><div class="member-list">${rows}</div><div class="member-add"><input class="field" id="newEventName" maxlength="40" placeholder="输入新赛事名称"><button id="createEvent" type="button">新建赛事</button></div>`;
    document.querySelectorAll('[data-switch-event]').forEach(button=>button.onclick=()=>{if(!persistActiveEvent())return;activeEventId=button.dataset.switchEvent;localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()});
    document.querySelectorAll('[data-rename-event]').forEach(button=>button.onclick=()=>{editingEventId=button.dataset.renameEvent;renderEventManager();$('renameEventName')?.focus()});
    document.querySelectorAll('[data-cancel-rename]').forEach(button=>button.onclick=()=>{editingEventId='';renderEventManager()});
    document.querySelectorAll('[data-confirm-rename]').forEach(button=>button.onclick=()=>{const id=button.dataset.confirmRename,event=eventIndex.find(item=>item.id===id),name=$('renameEventName')?.value.trim();if(!name){$('renameEventName')?.focus();return}event.name=name;event.updatedAt=new Date().toISOString();if(id===activeEventId){state.name=name;$('name').value=name;persistActiveEvent();render()}else{try{const saved=JSON.parse(localStorage.getItem(`ranking-event:${id}`)||'{}');saved.name=name;localStorage.setItem(`ranking-event:${id}`,JSON.stringify(saved))}catch{}}localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));editingEventId='';renderEventManager()});
    document.querySelectorAll('[data-delete-event]').forEach(button=>button.onclick=()=>{const id=button.dataset.deleteEvent,event=eventIndex.find(item=>item.id===id);if(eventIndex.length===1){alert('请先新建另一项赛事，再删除当前赛事。');return}if(!confirm(`将永久删除“${event?.name||'该赛事'}”及其全部数据。是否继续？`))return;eventIndex=eventIndex.filter(item=>item.id!==id);localStorage.removeItem(`ranking-event:${id}`);if(activeEventId===id)activeEventId=eventIndex[0].id;localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()});
    $('createEvent').onclick=()=>{const name=$('newEventName').value.trim();if(!name){$('newEventName').focus();return}if(!RankingBilling.canCreateEvent(billingEvents())){alert(RankingBilling.monthlyActive()?'个人包月同时最多 3 个独立小组，且不能归入同一赛事。':'基础服务最多创建 1 个独立小组。多个独立小组请开通个人包月，一届赛事内多个小组请开通赛事会员。');return}const id=`event-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,event=JSON.parse(JSON.stringify(defaultState));event.name=name;eventIndex.unshift({id,name,updatedAt:new Date().toISOString()});localStorage.setItem(`ranking-event:${id}`,JSON.stringify(event));localStorage.setItem(EVENT_INDEX_KEY,JSON.stringify(eventIndex));activeEventId=id;localStorage.setItem(ACTIVE_EVENT_KEY,activeEventId);location.reload()};
  };
  $('eventManager').onclick=()=>{renderEventManager();$('eventManagerDialog').showModal()};
  $('closeEventManager').onclick=()=>$('eventManagerDialog').close();
}
initEventManager();

if(sessionStorage.getItem("ranking-open-simulation")==="1"){sessionStorage.removeItem("ranking-open-simulation");document.querySelector('[data-view="simulation"]')?.click()}
